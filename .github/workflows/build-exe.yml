# Builds TimelineVisualiser.exe on a Windows machine.
# Runs on every push to main that touches the Python app, on version tags (v*),
# and on demand (Actions tab > Build Windows exe > Run workflow).
# Download the result from the run's "Artifacts"; tagged builds also attach it to a Release.
name: Build Windows exe
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app.py", "timeline.py", "requirements.txt", "sample_events.csv", ".github/workflows/build-exe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest -q
      - run: pyinstaller --onefile --name TimelineVisualiser --add-data "sample_events.csv:." --collect-all dash --collect-data plotly app.py
      - uses: actions/upload-artifact@v4
        with:
          name: TimelineVisualiser-windows
          path: dist/TimelineVisualiser.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TimelineVisualiser.exe
